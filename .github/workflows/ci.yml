name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Playwright 1.56 ne gère pas encore ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Vérifications (format, lint, types, architecture, tests, build, mesures, bout en bout)
        run: |
          bash ci/checks.sh
          {
            echo '## Mesures'
            echo '```json'
            cat ci-out/bench-engine.json 2>/dev/null
            cat ci-out/bench-map.json 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-out
          path: ci-out
